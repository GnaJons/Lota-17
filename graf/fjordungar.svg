<g fill="#073b63" font-family="Georgia,serif" text-anchor="middle">
<g font-size="25" font-weight="bold"><text x="450" y="111">I. fjórðungur</text><text x="190" y="111">II. fjórðungur</text><text x="190" y="319">III. fjórðungur</text><text x="450" y="319">IV. fjórðungur</text></g>
<g font-family="Cambria Math,Georgia,serif" font-size="30"><text x="450" y="151">(+, +)</text><text x="190" y="151">(−, +)</text><text x="190" y="358">(−, −)</text><text x="450" y="358">(+, −)</text></g>
<g font-family="Cambria Math,Georgia,serif" font-size="23"><text x="607" y="237" font-style="italic">x</text><text x="343" y="27" font-style="italic">y</text><text x="365" y="265">(0, 0)</text><text x="250" y="236">−1</text><text x="390" y="236">1</text><text x="298" y="148">1</text><text x="292" y="287">−1</text></g>
