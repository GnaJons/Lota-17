<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="600" height="403.125" role="img" aria-labelledby="fjor-title fjor-desc" style="--fig-width:480px">
<title id="fjor-title">Fjórir fjórðungar hnitakerfisins</title>
<desc id="fjor-desc">Fyrsti fjórðungur er efst til hægri, með jákvætt x og y. Annar er efst til vinstri, með neikvætt x og jákvætt y. Þriðji er neðst til vinstri, með neikvætt x og y. Fjórði er neðst til hægri, með jákvætt x og neikvætt y. Ásarnir tilheyra engum fjórðungi.</desc>
<rect x="60" y="40" width="260" height="170" fill="#fbf4dc"/><rect x="320" y="40" width="260" height="170" fill="#e1f2ef"/>
<rect x="60" y="210" width="260" height="170" fill="#f8ecf1"/><rect x="320" y="210" width="260" height="170" fill="#eef3ef"/>
<g stroke="#d6ded8" stroke-width="1" fill="none">
<path d="M110 40V380M180 40V380M250 40V380M390 40V380M460 40V380M530 40V380M60 70H580M60 140H580M60 280H580M60 350H580"/>
</g>
